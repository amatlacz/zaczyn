name: Check framework packages

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline packaging checks
        run: python3 scripts/check_bundle.py
      - name: Build and validate all editions
        run: python3 scripts/build_bundle.py
      - name: Verify archive checksums
        working-directory: dist
        run: sha256sum -c *.zip.sha256
